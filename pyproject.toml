[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ekpill"
version = "1.3.0"
description = "Dynamic Island & Hardware-Notch Desktop Utility Capsule for Windows 10 & 11"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Siddharth", email = "bhadusid1512@gmail.com" }
]
keywords = [
    "windows11",
    "dynamic-island",
    "hardware-notch",
    "desktop-app",
    "qt6",
    "qml",
    "pyside6",
    "wasapi",
    "winrt",
    "screen-recorder",
    "local-first"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Hardware"
]
dependencies = [
    "PySide6>=6.6",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth; sys_platform == 'win32'",
    "winrt-Windows.Devices.Radios; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications.Management; sys_platform == 'win32'"
]

[project.urls]
Homepage = "https://sidhu1512.github.io/ekpill/"
Documentation = "https://github.com/sidhu1512/ekpill#readme"
Repository = "https://github.com/sidhu1512/ekpill.git"
Issues = "https://github.com/sidhu1512/ekpill/issues"
Changelog = "https://github.com/sidhu1512/ekpill/blob/main/docs/UPDATES.md"

[project.scripts]
ekpill = "ekpill.main:main"
